services:
  python-api:
    build:
      context: .
      dockerfile: Backend/Dockerfile
    container_name: python-api
    ports:
      - "8000:8000"
    volumes:
      - ./Backend:/app
      - ./requirements.txt:/app/requirements.txt
    environment:
      - MONGO_URI=${MONGO_URI:-mongodb://mongodb:27017/loop-pc-builder}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      - mongodb
      - redis
    networks:
      - app-network

  node-server:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: node-server
    ports:
      - "3000:3000"
    volumes:
      - ./Frontend:/app
      # Anonymous volume to protect container node_modules from host mounts
      - /app/node_modules
      - /app/.next
    environment:
      - MONGO_URI=${MONGO_URI:-mongodb://mongodb:27017/loop-pc-builder}
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - python-api
      - mongodb
    networks:
      - app-network

  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mongo-data:
